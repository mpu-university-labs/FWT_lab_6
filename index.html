<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ЛР6 | Шероз Рахимов [251-362]</title>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        max-width: 820px;
        margin: 40px auto;
        padding: 0 20px;
        color: #202938;
        background: #f4f7fb;
        font:
          16px/1.5 system-ui,
          sans-serif;
      }
      main {
        padding: 28px;
        background: white;
        border: 1px solid #e2e8f0;
        border-radius: 16px;
        box-shadow: 0 8px 28px #1e293b0d;
      }
      h1 {
        margin: 0 0 8px;
        line-height: 1.2;
      }
      .intro {
        margin: 0 0 22px;
        color: #64748b;
      }
      .tasks {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
        gap: 14px;
      }
      .task {
        padding: 16px;
        border: 1px solid #e2e8f0;
        border-radius: 12px;
      }
      h2 {
        margin: 0 0 12px;
        font-size: 17px;
      }
      label {
        display: block;
        margin: 9px 0 4px;
        color: #475569;
        font-size: 14px;
      }
      input {
        width: 100%;
        padding: 9px 10px;
        border: 1px solid #cbd5e1;
        border-radius: 7px;
        font: inherit;
      }
      input:focus {
        outline: 2px solid #bfdbfe;
        border-color: #3b82f6;
      }
      button {
        margin-top: 12px;
        padding: 9px 13px;
        border: 0;
        border-radius: 7px;
        color: white;
        background: #2563eb;
        font: inherit;
        cursor: pointer;
      }
      button:hover {
        background: #1d4ed8;
      }
      .result {
        min-height: 24px;
        margin: 10px 0 0;
        overflow-wrap: anywhere;
        color: #166534;
        font-weight: 600;
      }
      .result.error {
        color: #b91c1c;
      }
      @media (max-width: 520px) {
        body {
          margin: 18px auto;
          padding: 0 12px;
        }
        main {
          padding: 18px;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <h1>ЛР6 | Шероз Рахимов [251-362]</h1>
      <p class="intro">
        Введите значения и нажмите кнопку, чтобы выполнить задание.
      </p>

      <div class="tasks">
        <section class="task">
          <h2>Возведение в степень</h2>
          <label for="pow-x">Основание x</label>
          <input id="pow-x" type="number" step="any" />
          <label for="pow-n">Натуральный показатель n</label>
          <input id="pow-n" type="number" min="1" step="1" />
          <button type="button" data-task="pow">Вычислить</button>
          <p class="result" id="pow-result" aria-live="polite"></p>
        </section>

        <section class="task">
          <h2>Алгоритм Евклида</h2>
          <label for="gcd-a">Неотрицательное целое a</label>
          <input id="gcd-a" type="number" min="0" step="1" />
          <label for="gcd-b">Неотрицательное целое b</label>
          <input id="gcd-b" type="number" min="0" step="1" />
          <button type="button" data-task="gcd">Вычислить</button>
          <p class="result" id="gcd-result" aria-live="polite"></p>
        </section>

        <section class="task">
          <h2>Наименьшая цифра</h2>
          <label for="digit-x">Неотрицательное целое число x</label>
          <input id="digit-x" type="number" min="0" step="1" />
          <button type="button" data-task="minDigit">Найти цифру</button>
          <p class="result" id="minDigit-result" aria-live="polite"></p>
        </section>

        <section class="task">
          <h2>Форма слова «запись»</h2>
          <label for="records-n">Количество записей n</label>
          <input id="records-n" type="number" min="0" step="1" />
          <button type="button" data-task="pluralizeRecords">
            Показать фразу
          </button>
          <p class="result" id="pluralizeRecords-result" aria-live="polite"></p>
        </section>

        <section class="task">
          <h2>Число Фибоначчи</h2>
          <label for="fibb-n">Индекс n (от 0 до 1000)</label>
          <input
            id="fibb-n"
            type="number"
            min="0"
            max="1000"
            step="1"
          />
          <button type="button" data-task="fibb">Найти число</button>
          <p class="result" id="fibb-result" aria-live="polite"></p>
        </section>
      </div>
    </main>

    <script>
      function pow(x, n) {
        if (!Number.isFinite(x) || !Number.isSafeInteger(n) || n < 1) {
          throw new RangeError(
            "натуральный n",
          );
        }
        let result = 1;
        for (let i = 0; i < n; i++) result *= x;
        return result;
      }

      // НОД: алгоритм Евклида заменяет пару (a, b) на (b, остаток от a / b).
      function gcd(a, b) {
        if (!Number.isSafeInteger(a) || !Number.isSafeInteger(b) || a < 0 || b < 0) {
          throw new RangeError(
            "Аргументы должны быть неотрицательными целыми числами!!!@(##)()",
          );
        }

        while (b !== 0) 
          [a, b] = [b, a % b];
        return a;
      }

      // Идём по цифрам числа справа налево и сохраняем минимальную из уже просмотренных.
      function minDigit(x) {
        if (!Number.isSafeInteger(x) || x < 0) {
          throw new RangeError("x должен быть неотрицательным целым числом");
        }
        if (x === 0)
          return 0;

        let min = 9;
        while (x > 0) {
          const digit = x % 10;
          if (digit < min) 
            min = digit;
          x = Math.floor(x / 10);
        }
        return min;
      }

      // Склонение: выбираем форму слова по последним двум и последней цифрам n.
      function pluralizeRecords(n) {
        if (!Number.isSafeInteger(n) || n < 0) {
          throw new RangeError("n должен быть неотрицательным целым числом");
        }

        const lastTwo = n % 100;
        const last = n % 10;
        let noun = "записей";
        let verb = "найдено";
        let bil = "было";

        if (lastTwo < 11 || lastTwo > 14) {
          if (last === 1) {
            noun = "запись";
            verb = "найдена";
            bil = "была";
          } else if (last >= 2 && last <= 4) {
            noun = "записи";
            verb = "найдены";
            bil = "были";
          }
        }

        return `В результате выполнения запроса ${bil} ${verb} ${n} ${noun}`;
      }

      // Число Фибоначчи: цикл складывает два предыдущих числа
      function fibb(n) {
        if (!Number.isInteger(n) || n < 0 || n > 1000) {
          throw new RangeError("n должен быть целым числом от 0 до 1000");
        }

        let previous = 0n;
        let current = 1n;

        for (let i = 0; i < n; i++) {
          [previous, current] = [current, previous + current];
        }
        return previous.toString();
      }

      // Считываем введённое значение и проверяем, что поле заполнено нормально
      function readNumber(id, label) {
        const input = document.getElementById(id);

        if (input.value.trim() === "")
          throw new Error(`Заполните поле «${label}»`);

        const value = Number(input.value);

        if (!Number.isFinite(value))
          throw new Error(`Проверьте значение поля «${label}»`);
        return value;
      }

      // Для каждой кнопки задаём вычисление: читаем нужные поля и вызываем функцию задания.
      const actions = {
        pow: () =>
          pow(
            readNumber("pow-x", "Основание x"),
            readNumber("pow-n", "Показатель n"),
          ),
        gcd: () => gcd(readNumber("gcd-a", "a"), readNumber("gcd-b", "b")),
        minDigit: () => minDigit(readNumber("digit-x", "Число x")),
        pluralizeRecords: () =>
          pluralizeRecords(readNumber("records-n", "Количество записей n")),
        fibb: () => fibb(readNumber("fibb-n", "Индекс n")),
      };

      // По нажатию вычисляем результат, выводим его в соответствующий блок или показываем ошибку.
      document.querySelectorAll("button[data-task]").forEach((button) => {
        button.addEventListener("click", () => {
          const task = button.dataset.task;
          const output = document.getElementById(`${task}-result`);
          output.classList.remove("error");
          try {
            output.textContent = actions[task]();
          } catch (error) {
            output.textContent = error.message;
            output.classList.add("error");
          }
        });
      });
    </script>
  </body>
</html>
